; CAN load generator for the SCIS FPGA throughput test.
;
; Board: Nucleo-F446RE. The F446 has bxCAN (HAL_CAN), not the H7's FDCAN, and its
; LQFP64 package has no port D, so CAN1 is on PB9 (TX, D14) / PB8 (RX, D15).
;
; BUS_WIRING must match the bitstream. top.vhd:471-479 is built as config (A)
; two-wire (ECHO_RX => true, TX_OPEN_DRAIN => false), so BUS_TWO_WIRE is the
; matching setting here: CAN_MODE_LOOPBACK with retransmission off, i.e.
; fire-and-forget. That is what a throughput ramp wants -- no retransmit stalls
; and no error-passive backoff distorting the send rate.
;
; Wiring: PB9 -> PMOD B pin 7 (can_rx), PMOD B pin 8 (can_tx) -> PB8, common GND.

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = arduino
build_flags =
    -DHAL_CAN_MODULE_ENABLED
    -DBUS_WIRING=BUS_TWO_WIRE
monitor_speed = 115200
